[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "recursive-trading-engine"
version = "2.0.0"
description = "Enterprise recursive trading algorithm platform with LSTM/Transformer models, backtesting, risk management, dashboard and API"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "yfinance>=0.2",
    "streamlit>=1.28",
    "fastapi>=0.105",
    "uvicorn[standard]>=0.24",
    "pydantic>=2.5",
    "plotly>=5.17",
    "redis>=5.0",
    "sqlalchemy>=2.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "ta>=0.10",
    "scipy>=1.11",
    "aiofiles>=23.2",
    "python-multipart>=0.0.6",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.1",
    "black>=23.11",
    "ruff>=0.1",
    "mypy>=1.7",
    "ipython>=8.19",
    "jupyter>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
